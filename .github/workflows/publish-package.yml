name: Publish organization package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse origin/main)" ]; then
            echo "Release tag must point at the current main commit." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@escaperoomengs"

      - run: npm ci
      - run: npx changeset version

      - name: Verify generated package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "Changesets generated v$PACKAGE_VERSION, but the pushed tag is $RELEASE_TAG." >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:package

      - name: Commit generated release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -fa "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:main "+refs/tags/$RELEASE_TAG"

      - name: Publish package if missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
            exit 0
          fi

          npm publish
